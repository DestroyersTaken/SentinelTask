name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows build & tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace
      - name: Real-input end-to-end test and leak checks (hotkeys, rebinding, recording, playback, long runs)
        run: cargo test -p sentineltask --release -- --ignored --test-threads=1 --nocapture
      - name: Release build
        run: cargo build --release
      - name: Smoke test
        shell: pwsh
        # SentinelTask.exe is a GUI-subsystem program, so PowerShell doesn't
        # wait for it or set $LASTEXITCODE; wait explicitly instead.
        run: |
          $p = Start-Process -FilePath target/release/SentinelTask.exe -ArgumentList '--version' -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0) { Write-Error "exit code $($p.ExitCode)"; exit 1 }
          $p = Start-Process -FilePath target/release/SentinelTask.exe -ArgumentList 'info','does-not-exist.stmacro' -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 1) { Write-Error "expected exit code 1 for a missing file, got $($p.ExitCode)"; exit 1 }
      - name: "GUI self-test (16 real-input scenarios: hotkeys, minimized, pause, rebind, clicker, compact, files, memory)"
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'selftest.txt'
          $env:SENTINEL_SELFTEST = $out
          $p = Start-Process -FilePath target/release/SentinelTask.exe -PassThru
          if (-not $p.WaitForExit(330000)) { Stop-Process -Id $p.Id -Force; Write-Error 'self-test hung'; exit 1 }
          if (Test-Path $out) { Get-Content $out } else { Write-Output "no result file" }
          $log = Join-Path $env:LOCALAPPDATA 'SentinelTask\logs\sentineltask.log'
          if (Test-Path $log) { Get-Content $log -Tail 30 }
          if ($p.ExitCode -ne 0) { Write-Error "self-test failed (exit $($p.ExitCode))"; exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: SentinelTask-windows-x64
          path: target/release/SentinelTask.exe
          if-no-files-found: error

  linux:
    name: Core tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install GUI build dependencies
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace

  package:
    name: Zip & installer
    needs: windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: SentinelTask-windows-x64
          path: build
      - name: Install NSIS
        run: sudo apt-get update && sudo apt-get install -y nsis zip
      - name: Package
        run: packaging/make-dist.sh build/SentinelTask.exe
      - uses: actions/upload-artifact@v4
        with:
          name: SentinelTask-setup-and-zip
          path: dist/*
          if-no-files-found: error
