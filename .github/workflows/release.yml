name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --workspace
      - name: Build
        run: cargo build --release
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/SentinelTask.exe dist/
          Copy-Item README.md, LICENSE dist/
          Compress-Archive -Path dist/* -DestinationPath SentinelTask-${{ github.ref_name }}-windows-x64.zip
          Get-FileHash dist/SentinelTask.exe -Algorithm SHA256 | Format-List | Out-File SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            SentinelTask-${{ github.ref_name }}-windows-x64.zip
            dist/SentinelTask.exe
            SHA256SUMS.txt
          generate_release_notes: true
