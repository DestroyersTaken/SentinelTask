name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --workspace
      - name: Build
        run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: exe
          path: target/release/SentinelTask.exe

  publish:
    needs: build
    # NSIS on Linux ships the 64-bit (amd64-unicode) installer stubs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: exe
          path: build
      - name: Install NSIS
        run: sudo apt-get update && sudo apt-get install -y nsis zip
      - name: Package
        run: packaging/make-dist.sh build/SentinelTask.exe
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/SentinelTask-*-setup.exe
            dist/SentinelTask-*-installer.zip
            dist/SentinelTask-*-portable.zip
            dist/SHA256SUMS.txt
          generate_release_notes: true
