[package]
name = "sentineltask"
description = "SentinelTask - a modern, reliable mouse & keyboard macro recorder for Windows."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "SentinelTask"
path = "src/main.rs"

[dependencies]
sentinel-core = { path = "../sentinel-core" }
serde.workspace = true
serde_json.workspace = true
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wgpu", "x11", "wayland", "accesskit"] }
egui_extras = { version = "0.37", default-features = false }
crossbeam-channel = "0.5"
parking_lot = "0.12"
dirs = "6"

[target.'cfg(windows)'.dependencies]
rfd = "0.17"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Media",
  "Win32_Security",
  "Win32_System_LibraryLoader",
  "Win32_System_Power",
  "Win32_System_Threading",
  "Win32_System_Performance",
  "Win32_System_ProcessStatus",
  "Win32_System_SystemInformation",
  "Win32_System_Console",
  "Win32_UI_HiDpi",
  "Win32_UI_Input",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
